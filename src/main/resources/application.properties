spring.application.name=gestion-pannes
server.port=8080

# --- Base de données MySQL ---
# La base "gestion_pannes" est créée automatiquement si elle n'existe pas.
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_pannes?createDatabaseIfNotExist=true&serverTimezone=Europe/Bucharest&characterEncoding=UTF-8
spring.datasource.username=root
# Remplacer "changeme" par le mot de passe root choisi lors de l'installation de MySQL
spring.datasource.password=${DB_PASSWORD:1234}

# --- JPA / Hibernate ---
# "update" : les tables sont créées / mises à jour à partir des entités Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Taille maximale des fichiers envoyés (photo de profil)
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
