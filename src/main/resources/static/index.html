<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accueil - Gestion des pannes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="contenu">
        <h1 id="titre">Accueil</h1>

        <nav class="actions">
            <a href="signaler.html">
                <strong>Signaler une panne</strong>
            </a>
            <a href="liste.html">
                <strong>Liste des pannes</strong>
            </a>
            <a href="mes-pannes.html">
                <strong>Mes pannes</strong>
            </a>
        </nav>
    </div>

    <script src="js/app.js"></script>
    <script>
        (async () => {
            const utilisateur = await exigerConnexion();
            if (!utilisateur) return;

            document.getElementById("titre").textContent = "Bonjour, " + utilisateur.nomComplet;

            afficherMiseEnPage(utilisateur, "accueil");
        })();
    </script>
</body>
</html>
