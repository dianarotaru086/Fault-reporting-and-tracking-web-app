<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signaler une panne - Gestion des pannes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="contenu">
    <h1 id="titre-page">Signaler une panne</h1>

    <div class="formulaire-page">
        <div id="alerte" class="alerte" hidden></div>

        <form id="formulaire" novalidate>
            <div class="champ" data-champ="titre">
                <label for="titre">Titre</label>
                <input type="text" id="titre" autocomplete="off">
                <div class="message-champ"></div>
            </div>

            <div class="champ" data-champ="description">
                <label for="description">Description</label>
                <textarea id="description"></textarea>
                <div class="message-champ"></div>
            </div>

            <div class="deux-colonnes">
                <div class="champ">
                    <label for="campusId">Campus</label>
                    <select id="campusId">
                        <option value="" selected disabled>Choisir…</option>
                    </select>
                </div>
                <div class="champ" data-champ="uniteId">
                    <label for="uniteId">Faculté ou service</label>
                    <select id="uniteId" disabled>
                        <option value="" selected disabled>Choisissez d'abord un campus</option>
                    </select>
                    <div class="message-champ"></div>
                </div>
            </div>

            <div class="champ" data-champ="lieu">
                <label for="lieu">Salle ou lieu précis</label>
                <input type="text" id="lieu" autocomplete="off">
                <div class="message-champ"></div>
            </div>

            <div class="deux-colonnes">
                <div class="champ" data-champ="categorie">
                    <label for="categorie">Catégorie</label>
                    <select id="categorie"></select>
                    <div class="message-champ"></div>
                </div>
                <div class="champ" data-champ="priorite">
                    <label for="priorite">Priorité</label>
                    <select id="priorite"></select>
                    <div class="message-champ"></div>
                </div>
            </div>

            <div class="boutons">
                <button type="submit" id="bouton-envoi">Signaler</button>
                <a class="bouton secondaire" id="lien-annuler" href="index.html">Annuler</a>
            </div>
        </form>
    </div>
</div>

<script src="js/app.js"></script>
<script>
    (async () => {
        const utilisateur = await exigerConnexion();
        if (!utilisateur) return;

        // Avec ?id=... on modifie une panne existante ; sinon on en signale une nouvelle.
        const id = new URLSearchParams(window.location.search).get("id");
        const edition = id !== null;

        // La mise en page recrée la page : on cherche les éléments APRÈS cet appel.
        afficherMiseEnPage(utilisateur, edition ? "liste" : "signaler");

        const formulaire = document.getElementById("formulaire");
        const alerte = document.getElementById("alerte");
        const selectCampus = document.getElementById("campusId");
        const selectUnite = document.getElementById("uniteId");
        let structure = [];

        function montrer(message, succes) {
            alerte.textContent = message;
            alerte.classList.toggle("succes", !!succes);
            alerte.hidden = false;
            window.scrollTo(0, 0);
        }

        if (edition) {
            document.getElementById("titre-page").textContent = "Modifier la panne";
            document.getElementById("bouton-envoi").textContent = "Enregistrer";
            document.getElementById("lien-annuler").href = "detail.html?id=" + encodeURIComponent(id);
        }

        // "Choisir…" s'affiche au début mais ne peut plus être re-choisi
        function remplir(select, options) {
            select.innerHTML = '<option value="" selected disabled>Choisir…</option>' +
                options.map(o => `<option value="${echapper(o.code)}">${echapper(o.libelle)}</option>`).join("");
        }

        // La liste des facultés dépend du campus choisi
        function remplirUnites(campusId, uniteId) {
            selectUnite.innerHTML = '<option value="" selected disabled>Choisir…</option>';
            const campus = structure.find(c => String(c.id) === String(campusId));
            if (!campus) {
                selectUnite.options[0].textContent = "Choisissez d'abord un campus";
                selectUnite.disabled = true;
                return;
            }
            campus.unites.forEach(u => selectUnite.add(new Option(u.nom, u.id)));
            selectUnite.disabled = false;
            if (uniteId) selectUnite.value = uniteId;
        }

        selectCampus.addEventListener("change", () => remplirUnites(selectCampus.value, null));

        // Pour une nouvelle panne : on propose d'abord le campus et la faculté du profil
        async function preselection() {
            try {
                const profil = await api("/api/profil");
                const campus = structure.find(c => c.nom === profil.campus);
                if (!campus) return;
                selectCampus.value = campus.id;
                const unite = campus.unites.find(u => u.nom === profil.unite);
                remplirUnites(campus.id, unite ? unite.id : null);
            } catch (e) {
                // pas grave : le formulaire reste simplement vide
            }
        }

        try {
            const [references, campusEtUnites] = await Promise.all([
                api("/api/references"), api("/api/structure")]);
            structure = campusEtUnites;
            remplir(document.getElementById("categorie"), references.categories);
            remplir(document.getElementById("priorite"), references.priorites);
            structure.forEach(c => selectCampus.add(new Option(c.nom, c.id)));
        } catch (e) {
            montrer(e.message, false);
        }

        if (edition) {
            // En modification : on vérifie le droit, puis on pré-remplit le formulaire
            try {
                const detail = await api("/api/pannes/" + encodeURIComponent(id));
                if (!detail.peutModifier) {
                    formulaire.hidden = true;
                    montrer("Cette panne ne peut plus être modifiée.", false);
                    return;
                }
                const p = detail.panne;
                document.getElementById("titre").value = p.titre;
                document.getElementById("description").value = p.description;
                document.getElementById("lieu").value = p.lieu;
                document.getElementById("categorie").value = p.categorie;
                document.getElementById("priorite").value = p.priorite;
                if (p.campusId) {
                    selectCampus.value = p.campusId;
                    remplirUnites(p.campusId, p.uniteId);
                }
            } catch (e) {
                formulaire.hidden = true;
                montrer(e.message, false);
                return;
            }
        } else {
            await preselection();
        }

        formulaire.addEventListener("submit", async (evenement) => {
            evenement.preventDefault();
            effacerErreurs(formulaire);
            alerte.hidden = true;

            const corps = {
                titre: document.getElementById("titre").value,
                description: document.getElementById("description").value,
                uniteId: selectUnite.value ? Number(selectUnite.value) : null,
                lieu: document.getElementById("lieu").value,
                categorie: document.getElementById("categorie").value || null,
                priorite: document.getElementById("priorite").value || null
            };

            try {
                if (edition) {
                    await api("/api/pannes/" + encodeURIComponent(id), { method: "PUT", corps });
                    window.location.href = "detail.html?id=" + encodeURIComponent(id);
                    return;
                }
                const panne = await api("/api/pannes", { method: "POST", corps });
                formulaire.reset();
                await preselection();
                montrer(`La panne n° ${panne.id} a été enregistrée (statut : ${panne.statutLibelle}).`, true);
            } catch (e) {
                const trouves = afficherErreursChamps(formulaire, e.erreurs);
                if (trouves === 0) {
                    montrer(e.message, false);
                }
            }
        });
    })();
</script>
</body>
</html>
