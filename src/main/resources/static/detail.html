<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Détail d'une panne - Gestion des pannes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="contenu">
    <p class="retour"><a href="liste.html">← Retour à la liste</a></p>
    <div id="alerte" class="alerte" hidden></div>
    <div id="fiche"></div>
</div>

<script src="js/app.js"></script>
<script>
    (async () => {
        const utilisateur = await exigerConnexion();
        if (!utilisateur) return;

        // La mise en page recrée la page : on cherche les éléments APRÈS cet appel.
        afficherMiseEnPage(utilisateur, "liste");

        const id = new URLSearchParams(window.location.search).get("id");
        const alerte = document.getElementById("alerte");
        const fiche = document.getElementById("fiche");

        function montrer(message, succes) {
            alerte.textContent = message;
            alerte.classList.toggle("succes", !!succes);
            alerte.hidden = false;
            window.scrollTo(0, 0);
        }

        function zoneActions(d) {
            if (d.peutPrendreEnCharge) {
                return `<div class="zone-action">
                                <button type="button" id="bouton-prise">Prendre en charge</button>
                            </div>`;
            }
            if (d.peutResoudre) {
                return `<div class="zone-action">
                                <label for="commentaire">Qu'avez-vous fait pour résoudre cette panne ?</label>
                                <textarea id="commentaire"></textarea>
                                <button type="button" id="bouton-resolution">Marquer comme résolue</button>
                                <div id="confirmation" class="confirmation" hidden>
                                    <p>Confirmez-vous que cette panne est bien résolue ? Cette action est définitive.</p>
                                    <button type="button" id="bouton-confirmer">Oui, elle est résolue</button>
                                    <button type="button" class="secondaire" id="bouton-annuler">Annuler</button>
                                </div>
                            </div>`;
            }
            return "";
        }

        function afficher(d) {
            const p = d.panne;
            const historique = d.interventions.map(i => `
                    <li>
                        <div class="quand">${formaterDateHeure(i.date)}</div>
                        <div><span class="quoi">${echapper(i.actionLibelle)}</span> · ${echapper(i.auteur)}</div>
                        ${i.commentaire ? `<p class="commentaire">${echapper(i.commentaire)}</p>` : ""}
                    </li>`).join("");

            fiche.innerHTML = `
                    <h1>${echapper(p.titre)}</h1>
                    <dl class="infos">
                        <dt>Statut</dt>
                        <dd><span class="statut ${classeStatut(p.statut)}">${echapper(p.statutLibelle)}</span></dd>
                        <dt>Priorité</dt>
                        <dd class="${p.priorite === "HAUTE" ? "priorite-haute" : ""}">${echapper(p.prioriteLibelle)}</dd>
                        <dt>Catégorie</dt><dd>${echapper(p.categorieLibelle)}</dd>
                        <dt>Lieu</dt><dd>${echapper(p.lieu)}</dd>
                        <dt>Signalée par</dt>
                        <dd>${echapper(p.signaleur)}, le ${formaterDateHeure(p.dateSignalement)}</dd>
                        ${p.responsable ? `<dt>Responsable</dt><dd>${echapper(p.responsable)}</dd>` : ""}
                        ${p.dateResolution ? `<dt>Résolue le</dt><dd>${formaterDateHeure(p.dateResolution)}</dd>` : ""}
                    </dl>

                    <h2>Description</h2>
                    <p class="description">${echapper(p.description)}</p>

                    ${zoneActions(d)}

                    <h2>Historique des interventions</h2>
                    <ol class="historique">${historique}</ol>`;

            document.getElementById("bouton-prise")?.addEventListener("click", () =>
                agir(`/api/pannes/${id}/prise-en-charge`, null, "La panne est maintenant prise en charge par vous."));

            document.getElementById("bouton-resolution")?.addEventListener("click", () =>
                agir(`/api/pannes/${id}/resolution`,
                    { commentaire: document.getElementById("commentaire").value },
                    "La panne est marquée comme résolue."));
            document.getElementById("bouton-prise")?.addEventListener("click", () =>
                agir(`/api/pannes/${id}/prise-en-charge`, null, "La panne est maintenant prise en charge par vous."));

            const boutonResolution = document.getElementById("bouton-resolution");
            if (boutonResolution) {
                const confirmation = document.getElementById("confirmation");
                const ouvrir = () => { boutonResolution.hidden = true; confirmation.hidden = false; };
                const fermer = () => { boutonResolution.hidden = false; confirmation.hidden = true; };

                boutonResolution.addEventListener("click", ouvrir);
                document.getElementById("bouton-annuler").addEventListener("click", fermer);
                document.getElementById("bouton-confirmer").addEventListener("click", () =>
                    agir(`/api/pannes/${id}/resolution`,
                        { commentaire: document.getElementById("commentaire").value },
                        "La panne est marquée comme résolue.",
                        fermer));
            }
        }

        async function charger() {
            try {
                afficher(await api("/api/pannes/" + encodeURIComponent(id)));
            } catch (e) {
                montrer(e.message, false);
            }
        }

        // Envoie une action ; en cas de refus (409, 403...), affiche le message
        // du serveur puis recharge la page pour montrer l'état réel de la panne.
        async function agir(url, corps, messageSucces, apresRefusDeSaisie) {
            alerte.hidden = true;
            try {
                afficher(await api(url, { method: "POST", corps: corps || {} }));
                montrer(messageSucces, true);
            } catch (e) {
                const detail = Object.values(e.erreurs || {})[0];
                montrer(detail || e.message, false);
                if (e.statut === 400) {
                    if (apresRefusDeSaisie) apresRefusDeSaisie();
                } else {
                    await charger();
                }
            }
        }

        if (!id) {
            montrer("Aucune panne sélectionnée.", false);
            return;
        }
        charger();
    })();
</script>
</body>
</html>
